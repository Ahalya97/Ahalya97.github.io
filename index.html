<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ahalya Mohan |Azure Data Engineer</title>

    <style>

        /* ==============================
           THEME
        ============================== */

        :root {

            --background: #0b1120;
            --surface: #111827;

            --primary-text: #f8fafc;
            --secondary-text: #cbd5e1;

            --accent: #38bdf8;

            --border: #263449;

            --nav-background: rgba(11, 17, 32, 0.85);

        }


        body.light {

            --background: #f8fafc;
            --surface: #ffffff;

            --primary-text: #0f172a;
            --secondary-text: #475569;

            --accent: #0284c7;

            --border: #e2e8f0;

            --nav-background: rgba(248, 250, 252, 0.90);

        }


        /* ==============================
           RESET
        ============================== */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            scroll-behavior: smooth;

        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--background);

            color: var(--primary-text);

            transition:
                background 0.4s ease,
                color 0.4s ease;

        }


        /* ==============================
           NAVIGATION
        ============================== */

        nav {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            padding: 20px 8%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            background: var(--nav-background);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid var(--border);

            z-index: 1000;

        }


        .logo {

            font-size: 26px;

            font-weight: 700;

            color: var(--accent);

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 30px;

            list-style: none;

        }


        .nav-links a {

            text-decoration: none;

            color: var(--primary-text);

            font-size: 15px;

            transition: 0.3s;

        }


        .nav-links a:hover {

            color: var(--accent);

        }


        /* ==============================
           THEME BUTTON
        ============================== */

        #theme-toggle {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            border: 1px solid var(--border);

            background: var(--surface);

            color: var(--primary-text);

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

        }


        #theme-toggle:hover {

            transform: rotate(15deg);

            border-color: var(--accent);

        }


        /* ==============================
           HERO
        ============================== */

        #home {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 120px 8% 80px;

            position: relative;

            overflow: hidden;

        }


        /* subtle background glow */

        #home::before {

            content: "";

            position: absolute;

            width: 450px;

            height: 450px;

            border-radius: 50%;

            background:
                rgba(56, 189, 248, 0.08);

            filter: blur(80px);

            top: 10%;

            left: 10%;

            z-index: -1;

        }


        #home::after {

            content: "";

            position: absolute;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            background:
                rgba(99, 102, 241, 0.08);

            filter: blur(80px);

            bottom: 10%;

            right: 10%;

            z-index: -1;

        }


        .hero {

            max-width: 900px;

            animation:
                fadeUp 1s ease forwards;

        }


        .hero-small {

            color: var(--accent);

            font-size: 20px;

            margin-bottom: 15px;

            font-weight: 500;

        }


        .hero h1 {

            font-size: clamp(45px, 7vw, 75px);

            line-height: 1.1;

            margin-bottom: 18px;

            font-weight: 750;

        }


        .hero h2 {

            font-size:
                clamp(22px, 3vw, 32px);

            color: var(--secondary-text);

            font-weight: 500;

            margin-bottom: 25px;

        }


        .hero h2 span {

            color: var(--accent);

        }


        .hero-description {

            max-width: 680px;

            margin: auto;

            color: var(--secondary-text);

            font-size: 17px;

            line-height: 1.8;

        }


        /* ==============================
           BUTTONS
        ============================== */

        .hero-buttons {

            margin-top: 35px;

        }


        .btn {

            display: inline-block;

            padding: 13px 28px;

            margin: 7px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;

        }


        .btn-primary {

            background: var(--accent);

            color: #ffffff;

        }


        .btn-secondary {

            border:
                1px solid var(--accent);

            color: var(--accent);

        }


        .btn:hover {

            transform:
                translateY(-4px);

        }


        /* ==============================
           ANIMATION
        ============================== */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 750px) {

            nav {

                padding:
                    15px 5%;

            }


            .nav-links {

                gap: 12px;

            }


            .nav-links a {

                font-size: 12px;

            }


            .hero-description {

                font-size: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         NAVIGATION
    ============================== -->

    <nav>

        <div class="logo">

            Ahalya Mohan

        </div>


        <ul class="nav-links">

            <li>
                <a href="#home">
                    Home
                </a>
            </li>

            <li>
                <a href="#about">
                    About
